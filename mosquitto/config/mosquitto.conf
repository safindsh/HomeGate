# MQTT-брокер только для локальных сервисов дома (Z2M <-> HA).
# Наружу не публикуется: слушает исключительно 127.0.0.1.
listener 1883 127.0.0.1
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
