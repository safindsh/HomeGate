
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Доступ через nginx-прокси (https://<host>:8443/ — HA не умеет работать в подкаталоге)
http:
  # Защита от перебора пароля: HA открыт снаружи на 8443,
  # после пяти неудачных попыток адрес блокируется (ip_bans.yaml).
  ip_ban_enabled: true
  login_attempts_threshold: 5
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12

# Метрики для Prometheus (эндпоинт /api/prometheus, нужен Bearer-токен)
prometheus:
  namespace: hass
  filter:
    exclude_domains:
      - automation
      - script
      - scene
      - person
      - zone
      - tts
      - conversation
    exclude_entity_globs:
      - sensor.backup_*
      - sensor.sun_*
