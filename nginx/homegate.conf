# Доверенный признак только для подсети агентов Claude.
# Локалка Димы сюда НЕ входит — он остаётся на своём токене (роль user).
map $remote_addr $homegate_trusted {
    default        "";
    ~^160\.79\.106\.  "agent";
}

# ── HomeGate: dashboards + MCP gate ────────────────────────────
# Самоподписанный сертификат. При переезде и покупке домена:
#   certbot --nginx -d <домен>   (заменит ssl_certificate сам)

server {
    if ($host = safindsh.keenetic.link) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name safindsh.keenetic.link;

    # ACME challenge — оставлен для будущего Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}

server {
    listen 443 ssl http2;
    server_name safindsh.keenetic.link;
    ssl_certificate /etc/letsencrypt/live/safindsh.keenetic.link/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/safindsh.keenetic.link/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/homegate.access.log;
    error_log  /var/log/nginx/homegate.error.log warn;

    # ── Дашборды (статика) ──
    root /var/www/dashboards;
    index index.html;

    # страница-подсказка при отказе входа (сама без пароля)
    error_page 401 /401.html;
    location = /401.html {
        auth_basic off;
        root /var/www/dashboards;
        internal;
    }

    # Обезличенный счётчик отказов авторизации для страницы 401.
    location = /auth-stats.json {
        auth_basic off;
        root /var/www/dashboards;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        # Basic Auth защищает только главную страницу и её статику.
        # MCP, API и остальные сервисы используют собственные ограничения.
        auth_basic "HomeGate — Вход";
        auth_basic_user_file /etc/nginx/.htpasswd_landing;

        # IP-фильтра нет намеренно: владелец заходит с произвольных сетей.
        # Рубежи — валидный TLS, пароль и ограничение частоты запросов.
        limit_req zone=landing burst=40 nodelay;
        try_files $uri $uri/ =404;
    }

    # ── Живые камеры через go2rtc ──
    # go2rtc слушает только localhost; наружу поток доступен через TLS
    # и тот же Basic Auth, что защищает стартовую страницу.
    location /go2rtc/ {
        auth_basic "HomeGate — Вход";
        auth_basic_user_file /etc/nginx/.htpasswd_landing;
        limit_req zone=landing burst=80 nodelay;

        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ── MCP-коннектор для Claude (FastMCP, как 5.prilutsky.ru) ──
    location = /.well-known/oauth-authorization-server { return 404; }
    location = /.well-known/oauth-protected-resource { return 404; }
    location /homegate-mcp {
        allow 160.79.106.0/24;  # подсеть агентов Claude
        allow 85.236.189.73;
        allow 85.236.186.16;
        allow 80.74.24.226;
        allow 127.0.0.1;
        allow 195.62.49.113;  # браузер Димы при добавлении коннектора
        deny all;
        proxy_pass http://127.0.0.1:8801/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # ── MCP-гейт ──
    location /claude-mcp {
        # Список как на skynet и monitoring: подсеть Anthropic, откуда
        # приходят агенты Claude, плюс ноды Тигры. Именно этот список
        # даёт агентам доступ к гейту.
        allow 160.79.106.0/24;  # Anthropic
        allow 85.236.189.73;
        allow 85.236.186.16;
        allow 80.74.24.226;
        allow 127.0.0.1;
        allow 192.168.0.0/16;   # домашняя сеть — для Димы
        deny all;

        # Затираем заголовок у входящих — подделать снаружи нельзя.
        # Ставим его сами: раз запрос прошёл allow-список выше, он доверенный.
        proxy_set_header X-Homegate-Trusted "";
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Homegate-Trusted $homegate_trusted;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # ── Состояния дома для стартовой страницы ──
    # Токен подставляет nginx из /etc/nginx/secrets/ha_auth.conf,
    # в JavaScript его класть нельзя — увидит любой через исходник.
    # Только чтение: GET /api/states, никаких сервисов.
    location = /api/home-states {
        # Тот же пароль, что и на странице: браузер шлёт его автоматически.
        # Без auth эндпоинт отдавал бы состояние дома кому угодно.
        auth_basic "HomeGate — Вход";
        auth_basic_user_file /etc/nginx/.htpasswd_landing;
        limit_req zone=landing burst=40 nodelay;

        proxy_pass http://127.0.0.1:8123/api/states;
        include /etc/nginx/secrets/ha_auth.conf;
        proxy_set_header Host $host;
        limit_except GET { deny all; }
    }

    # История значений для графиков на стартовой странице.
    # Путь после /api/home-history/ уходит в HA как /api/history/period/...
    location /api/home-history/ {
        auth_basic "HomeGate — Вход";
        auth_basic_user_file /etc/nginx/.htpasswd_landing;
        limit_req zone=landing burst=40 nodelay;

        proxy_pass http://127.0.0.1:8123/api/history/period/;
        include /etc/nginx/secrets/ha_auth.conf;
        proxy_set_header Host $host;
        limit_except GET { deny all; }
    }

    # ── Grafana ──
    location /grafana/ {
        include /etc/nginx/conf.d/internal_only.inc;
        proxy_pass http://127.0.0.1:3000;
        # Basic Auth от главной браузер повторно отправляет на тот же origin.
        # Grafana работает здесь как anonymous Viewer за nginx allowlist,
        # поэтому заголовок landing-авторизации до неё не пропускаем.
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grafana/api/live/ {
        include /etc/nginx/conf.d/internal_only.inc;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Zigbee2MQTT (управление сетью, не просто просмотр) ──
    # Тот же уровень защиты, что у Grafana: IP-allowlist + свой auth_token
    # внутри Z2M (frontend.auth_token в configuration.yaml).
    location /z2m/ {
        include /etc/nginx/conf.d/internal_only.inc;
        rewrite ^/z2m/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Home Assistant ──
    # HA НЕ УМЕЕТ работать в подкаталоге — вынесен на отдельный порт 8443,
    # см. /etc/nginx/conf.d/ha.conf. При появлении домена — сделать ha.<домен>.
    location = /ha {
        return 302 https://$host:8443/;
    }
    location /ha/ {
        return 302 https://$host:8443/;
    }

    # Qdrant наружу НЕ проксируем — только localhost
    location /reports/ {
       include /etc/nginx/conf.d/internal_only.inc;
       alias /var/www/reports/;
       index index.html;
       autoindex off;

       try_files $uri $uri/ /reports/index.html;
    }


}
